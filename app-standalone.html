<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 영어과목 3개년 로드맵 빌더 | 의령여자고등학교 선택과목 박람회</title>
  
  <!-- Academic Fonts (Pretendard & Cormorant Garamond) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    /* =========================================
       Academic Light Design Tokens
       ========================================= */
    :root {
      --color-oxford-navy: #0B2545;
      --color-oxford-navy-hover: #133A6B;
      --color-oxford-navy-subtle: #EEF4FB;

      --color-antique-amber: #D97706;
      --color-antique-amber-subtle: #FEF3C7;
      --color-highlighter-yellow: rgba(253, 224, 71, 0.55);

      --color-bg-base: #FFFFFF;
      --color-bg-surface: #F8FAFC;
      --color-bg-surface-elevated: #F1F5F9;

      --color-border-subtle: #E2E8F0;
      --color-border-medium: #CBD5E1;
      --color-border-strong: #94A3B8;

      --color-text-main: #0F172A;
      --color-text-secondary: #334155;
      --color-text-muted: #64748B;
      --color-text-light: #94A3B8;

      --font-serif: "Cormorant Garamond", "Batang", "Noto Serif KR", Georgia, serif;
      --font-sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      --font-mono: "JetBrains Mono", Menlo, Consolas, monospace;

      --shadow-sm: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.07), 0 2px 4px -2px rgba(15, 23, 42, 0.05);
      --shadow-academic: 0 12px 28px -6px rgba(11, 37, 69, 0.12);

      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      --radius-full: 9999px;

      --transition-fast: 150ms cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-bg-surface);
      color: var(--color-text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* 학술 헤더 */
    .academic-header {
      background-color: var(--color-bg-base);
      border-bottom: 1px solid var(--color-border-subtle);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .academic-title {
      font-family: var(--font-serif);
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--color-oxford-navy);
    }

    .academic-subtitle {
      font-size: 0.8125rem;
      color: var(--color-text-muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .academic-card {
      background-color: var(--color-bg-base);
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition-fast), border-color var(--transition-fast), box-shadow var(--transition-fast);
    }

    .academic-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.55rem;
      font-size: 0.725rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      letter-spacing: 0.02em;
      line-height: 1;
    }

    .badge-suneung {
      background-color: var(--color-antique-amber-subtle);
      color: var(--color-antique-amber);
      border: 1px solid rgba(217, 119, 6, 0.2);
    }

    .badge-career {
      background-color: #E0F2FE;
      color: #0369A1;
      border: 1px solid rgba(3, 105, 161, 0.2);
    }

    .badge-fusion {
      background-color: #F3E8FF;
      color: #7E22CE;
      border: 1px solid rgba(126, 34, 206, 0.2);
    }

    .badge-required {
      background-color: #F1F5F9;
      color: #334155;
      border: 1px solid #CBD5E1;
    }

    .academic-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      cursor: pointer;
      border: 1px solid transparent;
      transition: all var(--transition-fast);
    }

    .btn-primary {
      background-color: var(--color-oxford-navy);
      color: #FFFFFF;
    }
    .btn-primary:hover {
      background-color: var(--color-oxford-navy-hover);
    }

    .btn-outline {
      background-color: transparent;
      border-color: var(--color-border-medium);
      color: var(--color-text-secondary);
    }
    .btn-outline:hover {
      border-color: var(--color-oxford-navy);
      color: var(--color-oxford-navy);
      background-color: var(--color-oxford-navy-subtle);
    }

    .highlight-text {
      background-color: var(--color-highlighter-yellow);
      padding: 2px 4px;
      border-radius: 2px;
      mix-blend-mode: multiply;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .curriculum-item-card:hover {
      transform: translateY(-2px);
      border-color: var(--color-border-strong) !important;
      box-shadow: var(--shadow-md) !important;
    }

    .curriculum-item-card.selected-card {
      border-color: var(--color-oxford-navy) !important;
      background-color: #FFFFFF !important;
      box-shadow: 0 4px 12px rgba(11, 37, 69, 0.12) !important;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }

    .session-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.8125rem;
      color: var(--color-text-muted);
    }

    .timer-indicator {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-family: var(--font-mono);
      background-color: var(--color-bg-surface-elevated);
      padding: 0.25rem 0.65rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border-subtle);
    }

    .app-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.5rem;
      align-items: start;
    }

    @media (max-width: 1024px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }

    .career-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
    }

    .career-chip {
      padding: 0.75rem;
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-md);
      background: var(--color-bg-base);
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all var(--transition-fast);
    }

    .career-chip:hover {
      border-color: var(--color-oxford-navy);
      background: var(--color-oxford-navy-subtle);
    }

    .career-chip.selected {
      background: var(--color-oxford-navy);
      color: #FFFFFF;
      border-color: var(--color-oxford-navy);
      box-shadow: var(--shadow-md);
    }

    /* =========================================
       Wizard Funnel CSS Styles
       ========================================= */
    .wizard-funnel-container {
      max-width: 820px;
      margin: 1.5rem auto 3rem;
      background: var(--color-bg-base);
      border: 1px solid var(--color-border-subtle);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(11, 37, 69, 0.08);
      overflow: hidden;
      animation: fadeIn 0.2s ease-out;
    }

    .wizard-progress-header {
      background: #FFFFFF;
      border-bottom: 1px solid var(--color-border-subtle);
      padding: 1.25rem 2rem 1rem;
    }

    .wizard-progress-track {
      width: 100%;
      height: 6px;
      background: #E2E8F0;
      border-radius: 9999px;
      overflow: hidden;
      margin-top: 0.75rem;
    }

    .wizard-progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--color-oxford-navy), var(--color-antique-amber));
      border-radius: 9999px;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .wizard-step-indicator {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--color-text-muted);
    }

    .wizard-step-indicator .active-step-title {
      color: var(--color-oxford-navy);
      font-size: 0.85rem;
    }

    .wizard-body {
      padding: 2.25rem 2.25rem 1.75rem;
      min-height: 480px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .wizard-headline {
      font-family: var(--font-serif);
      font-size: 1.65rem;
      font-weight: 700;
      color: var(--color-oxford-navy);
      margin-bottom: 0.4rem;
      line-height: 1.3;
    }

    .wizard-subheadline {
      font-size: 0.9rem;
      color: var(--color-text-secondary);
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    .wizard-card-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.85rem;
    }

    .wizard-select-card {
      background: #FFFFFF;
      border: 2px solid var(--color-border-subtle);
      border-radius: 10px;
      padding: 1.25rem;
      cursor: pointer;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .wizard-select-card:hover {
      border-color: var(--color-border-strong);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(11, 37, 69, 0.08);
    }

    .wizard-select-card.selected {
      border-color: var(--color-oxford-navy);
      background: var(--color-oxford-navy-subtle);
      box-shadow: 0 0 0 1px var(--color-oxford-navy), 0 8px 20px rgba(11, 37, 69, 0.12);
    }

    .wizard-footer {
      border-top: 1px solid var(--color-border-subtle);
      padding: 1.15rem 2.25rem;
      background: #F8FAFC;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .wizard-btn-prev {
      background: transparent;
      border: 1px solid var(--color-border-medium);
      color: var(--color-text-secondary);
      padding: 0.65rem 1.25rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.15s;
    }

    .wizard-btn-prev:hover {
      background: #FFFFFF;
      border-color: var(--color-oxford-navy);
      color: var(--color-oxford-navy);
    }

    .wizard-btn-next {
      background: var(--color-oxford-navy);
      color: #FFFFFF;
      border: none;
      padding: 0.75rem 2rem;
      border-radius: var(--radius-md);
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(11, 37, 69, 0.2);
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .wizard-btn-next:hover {
      background: var(--color-oxford-navy-hover);
      transform: translateY(-1px);
    }

    .mode-switch-bar {
      display: flex;
      justify-content: center;
      padding: 0.65rem 1rem;
      background: #FFFFFF;
      border-bottom: 1px solid var(--color-border-subtle);
    }

    .mode-switch-toggle {
      display: inline-flex;
      background: var(--color-bg-surface-elevated);
      padding: 3px;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border-subtle);
    }

    .mode-btn {
      padding: 0.45rem 1.25rem;
      border-radius: var(--radius-full);
      font-size: 0.825rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      background: transparent;
      color: var(--color-text-muted);
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: var(--color-oxford-navy);
      color: #FFFFFF;
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>

  <!-- Top Academic Navigation Bar -->
  <header class="academic-header">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <div style="width: 38px; height: 38px; border-radius: 50%; background: var(--color-oxford-navy); color: #FFF; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-size: 1.2rem; font-weight: 700;">
        U
      </div>
      <div>
        <h1 class="academic-title">의령여자고등학교 선택과목 박람회</h1>
        <div class="academic-subtitle">영어과 부스 • 나의 영어과목 3개년 로드맵 빌더</div>
      </div>
    </div>

    <!-- Kiosk Session & Reset -->
    <div class="session-bar">
      <span>부스 세션 자동 초기화:</span>
      <div class="timer-indicator">
        <span>⏱️</span>
        <strong id="kiosk-timer-display">03:00</strong>
      </div>
      <button id="btn-manual-reset" class="academic-btn btn-outline" style="font-size: 0.75rem; padding: 0.35rem 0.65rem;">
        새로 시작
      </button>
    </div>
  </header>

  <!-- View Mode Switcher -->
  <div class="mode-switch-bar">
    <div class="mode-switch-toggle">
      <button id="mode-btn-wizard" class="mode-btn active" onclick="window.switchViewMode('wizard')">
        🚀 1:1 단계별 시작 (다이렉트 모드)
      </button>
      <button id="mode-btn-dashboard" class="mode-btn" onclick="window.switchViewMode('dashboard')">
        📊 전체 한눈에 보기 (전문가 모드)
      </button>
    </div>
  </div>

  <!-- Container for Wizard Funnel Mode (Default) -->
  <div id="view-mode-wizard" style="display: block;">
    <div id="wizard-funnel-mount-slot"></div>
  </div>

  <!-- Container for Full Dashboard Mode (Toggleable) -->
  <div id="view-mode-dashboard" style="display: none;">
    <main class="app-container">
    <div class="grid-layout">
      
      <!-- Left Column: Input, Career Selection & Roadmap Builder -->
      <section style="display: flex; flex-direction: column; gap: 1.25rem;">
        
        <!-- Step 1: Student Profile & Career Category -->
        <div class="academic-card">
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;">
            <span style="font-family: var(--font-serif); font-weight: 700; color: var(--color-oxford-navy); font-size: 1.1rem;">01.</span>
            <h3 style="font-size: 1rem; font-weight: 700; color: var(--color-oxford-navy);">진로 희망 계열 선택</h3>
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
            <div>
              <label style="font-size: 0.75rem; color: var(--color-text-muted); display: block; margin-bottom: 0.25rem;">학생 이름</label>
              <input type="text" id="input-student-name" placeholder="예: 김의령" style="width: 100%; padding: 0.5rem; border: 1px solid var(--color-border-subtle); border-radius: 4px; font-size: 0.875rem;">
            </div>
            <div>
              <label style="font-size: 0.75rem; color: var(--color-text-muted); display: block; margin-bottom: 0.25rem;">희망 직업 / 목표 세부진로 (입력 시 교과서 스마트 매칭)</label>
              <input type="text" id="input-target-career" placeholder="예: CRISPR 연구원, AI 윤리 전문가, 법조인" style="width: 100%; padding: 0.5rem; border: 1px solid var(--color-border-subtle); border-radius: 4px; font-size: 0.875rem;">
            </div>
          </div>

          <label style="font-size: 0.75rem; color: var(--color-text-muted); display: block; margin-bottom: 0.5rem;">6대 핵심 진로 계열</label>
          <div class="career-grid" id="career-category-container"></div>
        </div>

        <!-- Step 2: 3-Year English Curriculum Roadmap Slot -->
        <div id="curriculum-roadmap-slot"></div>

        <!-- Step 3: Textbook Evidence & PDF Viewer Slot -->
        <div id="module-textbook-preview-slot"></div>

        <!-- Step 4: Academic Advisor 3-Step Guide -->
        <div class="academic-card" style="border-left: 4px solid var(--color-oxford-navy);">
          <div style="display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.75rem;">
            <span style="font-family: var(--font-serif); font-weight: 700; color: var(--color-oxford-navy); font-size: 1.1rem;">03.</span>
            <h3 style="font-size: 1rem; font-weight: 700; color: var(--color-oxford-navy);">아카데믹 어드바이저 세특 가이드</h3>
          </div>
          <div id="academic-advice-container" style="display: flex; flex-direction: column; gap: 0.65rem; font-size: 0.875rem;"></div>
        </div>

      </section>

      <!-- Right Column: Academic 4-Cut Card Realtime Preview -->
      <aside style="position: sticky; top: 5rem;">
        <div class="academic-card" style="box-shadow: var(--shadow-academic);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="font-family: var(--font-serif); font-size: 1.15rem; color: var(--color-oxford-navy); font-weight: 700;">
              아카데믹 네컷 로드맵 카드
            </h3>
            <span class="academic-badge badge-suneung">4x6 인치 즉석 인쇄용</span>
          </div>

          <!-- Card Mount Slot -->
          <div id="photocard-preview-slot" style="display: flex; justify-content: center; margin-bottom: 1.25rem;"></div>

          <!-- Actions -->
          <div style="display: flex; flex-direction: column; gap: 0.5rem;">
            <button id="btn-open-booth" class="academic-btn" style="
              background: #0B2545;
              color: #FFFFFF;
              border: 2px solid #D97706;
              padding: 0.85rem;
              font-size: 0.95rem;
              font-weight: 700;
              border-radius: var(--radius-md);
              box-shadow: 0 4px 12px rgba(11, 37, 69, 0.18);
              cursor: pointer;
              transition: all 0.15s;
            ">
              📸 웹캠으로 네컷사진 촬영하기
            </button>
            <div style="display: flex; gap: 0.5rem;">
              <button id="btn-print-card" class="academic-btn btn-primary" style="flex: 1;">
                🖨️ 네컷 카드 즉석 출력
              </button>
              <button id="btn-save-telemetry" class="academic-btn btn-outline">
                💾 완료 로깅
              </button>
            </div>
          </div>
        </div>
      </aside>

    </div>
  </main>
  </div>

  <!-- Complete Standalone JavaScript Bundle -->
  <script>
    // [1] Constants & Types
    const CAREER_CATEGORIES = [
      { id: "HUMANITIES", name: "인문·어문·통번역 계열", description: "어문학, 문화인류학, 국제지역학, 통번역, 철학 등 언어와 인문학적 소양 중심" },
      { id: "SOCIAL_COMMERCE", name: "사회과학·상경·경영·로스쿨 계열", description: "경제, 경영, 정치외교, 행정, 미디어, 법학 등 글로벌 시사 및 논증 중심" },
      { id: "NATURAL_SCIENCE", name: "자연과학·순수기초학문 계열", description: "수학, 물리학, 화학, 생명과학, 지구과학 등 원서 독해 및 기초 연구 중심" },
      { id: "ENGINEERING_IT", name: "공학·IT·인공지능 계열", description: "컴퓨터공학, 전자·기계, 소프트웨어, 인공지능 등 기술 문서 및 글로벌 협업 중심" },
      { id: "MEDICINE_BIO", name: "의약·바이오·보건 계열", description: "의예, 약학, 간호, 생명공학, 보건의료 등 바이오 윤리 및 최신 의과학 논문 중심" },
      { id: "EDUCATION", name: "교육·사범 계열", description: "영어교육, 초등교육, 사범대학 등 교수학습 방법론 및 글로벌 교육 다문화 중심" }

    class SimpleStore {
      constructor() {
        this.state = {
          profile: {
            schoolName: "의령여자고등학교",
            grade: 1, classNum: 1, name: "",
            targetCareer: "", careerCategory: "공학·IT·인공지능 계열", careerCategoryId: "ENGINEERING_IT",
            photoDataUrl: null
          },
          curriculum: {
            year1: ["공통영어1", "공통영어2"],
            year2: ["영어Ⅰ", "영어 독해와 작문"],
            year3Career: ["직무 영어"],
            year3Fusion: ["실생활 영어 회화"]
          },
          matchedTextbook: INDEXED_CHUNKS[2],
          academicAdvice: ACADEMIC_FALLBACK_PRESETS.ENGINEERING_IT
        };
        this.listeners = [];
      }

      getState() { return JSON.parse(JSON.stringify(this.state)); }

      subscribe(fn) { this.listeners.push(fn); }

      notify() {
        const s = this.getState();
        this.listeners.forEach(fn => fn(s));
      }

      updateProfile(patch) {
        Object.assign(this.state.profile, patch);
        this.notify();
      }

      setCategory(catId) {
        const cat = CAREER_CATEGORIES.find(c => c.id === catId);
        const preset = CAREER_ROADMAP_PRESETS[catId];
        if (!cat || !preset) return;

        this.state.profile.careerCategory = cat.name;
        this.state.profile.careerCategoryId = cat.id;
        this.state.curriculum.year1 = [...preset.year1];
        this.state.curriculum.year2 = [...preset.year2];
        this.state.curriculum.year3Career = [...preset.year3CareerDefault];
        this.state.curriculum.year3Fusion = [...preset.year3FusionDefault];

        this.matchTextbook(cat.name, this.state.profile.targetCareer);
        this.updateAdvice(cat.id, this.state.profile.targetCareer);
        this.notify();
      }

      toggleSubject(group, name) {
        const list = this.state.curriculum[group];
        const idx = list.indexOf(name);
        if (idx >= 0) list.splice(idx, 1);
        else list.push(name);
        this.notify();
      }

      matchTextbook(categoryName, keyword = "", specificChunkId = null) {
        if (specificChunkId) {
          const found = INDEXED_CHUNKS.find(c => c.chunk_id === specificChunkId);
          if (found) {
            this.state.matchedTextbook = found;
            return;
          }
        }

        const candidates = INDEXED_CHUNKS.filter(c => 
          c.career_category.some(cat => cat.includes(categoryName) || categoryName.includes(cat))
        );

        if (candidates.length === 0) {
          this.state.matchedTextbook = INDEXED_CHUNKS[0];
          return;
        }

        const cleanKw = (keyword || "").trim().toLowerCase();
        if (!cleanKw) {
          this.state.matchedTextbook = candidates[0];
          return;
        }

        let best = candidates[0];
        let maxScore = -1;
        const tokens = cleanKw.split(/[\s,·\/\-]+/).filter(t => t.length > 1);

        for (const c of candidates) {
          let score = 0;
          for (const t of tokens) {
            if (c.keywords && c.keywords.some(k => k.includes(t) || t.includes(k))) score += 5;
            if (c.topic_ko && c.topic_ko.toLowerCase().includes(t)) score += 4;
            if (c.topic_en && c.topic_en.toLowerCase().includes(t)) score += 3;
            if (c.raw_text && c.raw_text.toLowerCase().includes(t)) score += 2;
          }
          if (score > maxScore) {
            maxScore = score;
            best = c;
          }
        }
        this.state.matchedTextbook = best;
      }

      updateAdvice(catId, targetCareer = "") {
        const preset = ACADEMIC_FALLBACK_PRESETS[catId] || ACADEMIC_FALLBACK_PRESETS.ENGINEERING_IT;
        this.state.academicAdvice = {
          academicLink: preset.academicLink,
          seTeukGuideline: targetCareer ? `[목표: ${targetCareer}] ${preset.seTeukGuideline}` : preset.seTeukGuideline,
          academicAdvantage: preset.academicAdvantage
        };
      }

      reset() {
        this.setCategory("ENGINEERING_IT");
        this.state.profile.name = "";
        this.state.profile.targetCareer = "";
        this.notify();
      }
    }

    window.startShutterCountdown = () => {
      const countdownEl = document.getElementById('booth-countdown');
      const shutterBtn = document.getElementById('booth-shutter-btn');
      shutterBtn.disabled = true;
      shutterBtn.style.opacity = '0.5';

      let count = 3;
      countdownEl.textContent = count;
      countdownEl.style.display = 'block';
      playTone(880, 0.1);

      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownEl.textContent = count;
          playTone(880, 0.1);
        } else {
          clearInterval(interval);
          countdownEl.style.display = 'none';
          captureSnapshot();
        }
      }, 1000);
    };

    function captureSnapshot() {
      // Shutter sound & flash
      playShutterSound();
      const flashEl = document.getElementById('booth-flash');
      if (flashEl) {
        flashEl.style.opacity = '1';
        setTimeout(() => { flashEl.style.opacity = '0'; }, 100);
      }

      const videoEl = document.getElementById('booth-video');
      const canvas = document.createElement('canvas');
      canvas.width = 640;
      canvas.height = 480;
      const ctx = canvas.getContext('2d');

      // Mirror mode
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);

      if (selectedFilter === 'bw') ctx.filter = 'grayscale(100%) contrast(110%)';
      else if (selectedFilter === 'oxford') ctx.filter = 'contrast(105%) saturate(85%)';

      ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      const photoDataUrl = canvas.toDataURL('image/jpeg', 0.92);

      store.updateProfile({ photoDataUrl });
      setTimeout(() => {
        window.closeWebcamBooth();
      }, 350);
    }

    window.handlePhotoUpload = (e) => {

        reader.onload = (event) => {
          store.updateProfile({ photoDataUrl: event.target.result });
          window.closeWebcamBooth();
        };
        reader.readAsDataURL(file);
      }
    };

    function playTone(freq, duration) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    function playShutterSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'square';
        osc.frequency.setValueAtTime(320, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);
      } catch (e) {}
    }

                return `
                  <div class="wizard-select-card ${isSel ? 'selected' : ''}" onclick="window.wizardSelectCategory('${cat.id}')">
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
                      <span class="academic-badge ${isSel ? 'badge-suneung' : 'badge-career'}">${cat.name.split(' ')[0]}</span>
                      ${isSel ? '<span style="color:#0B2545; font-weight:700; font-size:0.85rem;">✓ 선택됨</span>' : ''}
                    </div>
                    <h4 style="font-size:1.05rem; font-weight:700; color:#0B2545; margin-bottom:4px;">${cat.name}</h4>
                    <p style="font-size:0.78rem; color:#475569; line-height:1.4;">${cat.description}</p>
                  </div>
                `;
              }).join('')}
            </div>
          </div>
        `;
      } else if (wizardCurrentStep === 3) {
        const allSubs = Object.values(CURRICULUM_METADATA);
        const y3Career = allSubs.filter(s => s.grade === 3 && s.type === "진로선택");
        const y3Fusion = allSubs.filter(s => s.grade === 3 && s.type === "융합선택");
        return `
          <div>
            <div style="font-size:0.75rem; font-weight:700; color:#D97706; text-transform:uppercase; margin-bottom:4px;">STEP 03. 3-YEAR CURRICULUM</div>
            <h2 class="wizard-headline">3학년 영어 선택과목을 결정하세요.</h2>
            <p class="wizard-subheadline">1학년(공통필수)과 2학년(수능 일반선택)은 이미 탄탄히 배치되었습니다. 3학년에서 이수할 과목을 터치하여 선택/해제하세요.</p>
            
            <div style="margin-bottom:1.25rem;">
              <div style="font-size:0.85rem; font-weight:700; color:#B45309; margin-bottom:6px;">📚 진로선택 과목군 (성취평가 A·B·C)</div>
              <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;">
                ${y3Career.map(s => {
                  const sel = state.curriculum.year3Career.includes(s.name);
                  return `
                    <div class="curriculum-item-card ${sel ? 'selected-card' : ''}" onclick="window.wizardToggleSubject('year3Career', '${s.name}')" style="background:#FFF; border:2px solid ${sel ? '#0B2545':'#E2E8F0'}; border-radius:8px; padding:10px; cursor:pointer;">
                      <div style="font-weight:700; font-size:0.95rem; color:${sel ? '#0B2545':'#0F172A'};">${s.name}</div>
                      <div style="font-size:0.7rem; color:#64748B; margin-top:4px;">${s.summary.slice(0, 36)}...</div>
                      <div style="margin-top:6px; font-size:0.75rem; font-weight:700; color:${sel ? '#0B2545':'#94A3B8'};">${sel ? '✓ 선택됨' : '터치하여 추가'}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>

            <div>
              <div style="font-size:0.85rem; font-weight:700; color:#7C2D12; margin-bottom:6px;">🌐 융합선택 과목군 (실생활·다학제)</div>
              <div style="display:grid; grid-template-columns:repeat(3, 1fr); gap:8px;">
                ${y3Fusion.map(s => {
                  const sel = state.curriculum.year3Fusion.includes(s.name);
                  return `
                    <div class="curriculum-item-card ${sel ? 'selected-card' : ''}" onclick="window.wizardToggleSubject('year3Fusion', '${s.name}')" style="background:#FFF; border:2px solid ${sel ? '#0B2545':'#E2E8F0'}; border-radius:8px; padding:10px; cursor:pointer;">
                      <div style="font-weight:700; font-size:0.95rem; color:${sel ? '#0B2545':'#0F172A'};">${s.name}</div>
                      <div style="font-size:0.7rem; color:#64748B; margin-top:4px;">${s.summary.slice(0, 36)}...</div>
                      <div style="margin-top:6px; font-size:0.75rem; font-weight:700; color:${sel ? '#0B2545':'#94A3B8'};">${sel ? '✓ 선택됨' : '터치하여 추가'}</div>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          </div>
        `;
      } else if (wizardCurrentStep === 4) {
        const tb = state.matchedTextbook;
        const adv = state.academicAdvice;
        return `
          <div>
            <div style="font-size:0.75rem; font-weight:700; color:#D97706; text-transform:uppercase; margin-bottom:4px;">STEP 04. ACADEMIC EVIDENCE</div>
            <h2 class="wizard-headline">선택한 진로와 직결된 교과서 구절 & 세특 탐구입니다.</h2>
            <p class="wizard-subheadline">의령여고 영어과 교과서에서 추출한 실제 지문과 학생부 종합전형 맞춤형 탐구 주제 1선을 확인하세요.</p>

            <div style="background:#FFF; border:2px solid #D97706; border-radius:8px; padding:1.25rem; margin-bottom:1rem;">
              <div style="display:flex; gap:6px; margin-bottom:6px;">
                <span class="academic-badge badge-suneung">${tb.textbook.split(' ')[0]} (p.${tb.page})</span>
                <span class="academic-badge badge-career">${state.profile.careerCategory}</span>
              </div>
              <h4 style="font-family:var(--font-serif); font-size:1.2rem; color:#0B2545; margin-bottom:8px;">${tb.unit}</h4>
              <div style="background:#F8FAFC; padding:1rem; border-radius:6px; font-size:0.925rem; line-height:1.7; font-style:italic; border:1px solid #E2E8F0;">
                "<span class="highlight-text">${tb.raw_text}</span>"
              </div>
            </div>

            <div style="background:#FEF3C7; border-left:4px solid #D97706; padding:1rem 1.25rem; border-radius:0 8px 8px 0;">
              <strong style="color:#B45309; font-size:0.875rem; display:block; margin-bottom:4px;">🌟 학생부 세특 추천 탐구 주제 1선:</strong>
              <p style="color:#78350F; font-size:0.875rem; line-height:1.5; font-weight:500;">${adv.seTeukGuideline}</p>
            </div>
          </div>
        `;
      } else if (wizardCurrentStep === 5) {
        const hasPhoto = !!state.profile.photoDataUrl;
        return `
          <div>
            <div style="font-size:0.75rem; font-weight:700; color:#D97706; text-transform:uppercase; margin-bottom:4px;">STEP 05. PHOTOBOOTH & FINAL DELIVERABLE</div>
            <h2 class="wizard-headline">마지막 단계! 네컷사진을 찍고 완성하세요.</h2>
            <p class="wizard-subheadline">웹캠으로 즉석 사진을 촬영하면 우측 아카데믹 네컷 카드에 실시간 합성됩니다.</p>

            <div style="display:flex; gap:2rem; align-items:flex-start; justify-content:center; flex-wrap:wrap;">
              <div style="text-align:center; max-width:220px;">
                <div style="width:130px; height:160px; border:2px dashed #0B2545; border-radius:8px; margin:0 auto 1rem; overflow:hidden; background:#F1F5F9; display:flex; align-items:center; justify-content:center;">
                  ${hasPhoto ? `
                    <img src="${state.profile.photoDataUrl}" style="width:100%; height:100%; object-fit:cover;">
                  ` : `
                    <div style="color:#64748B;">
                      <div style="font-size:2.5rem;">📸</div>
                      <div style="font-size:0.75rem; font-weight:700; margin-top:2px;">사진 미촬영</div>
                    </div>
                  `}
                </div>
                <button onclick="window.openWebcamBooth()" class="academic-btn btn-primary" style="width:100%; padding:0.75rem; font-weight:700; border:2px solid #D97706;">
                  ${hasPhoto ? '🔄 사진 다시 찍기' : '📸 3초 타이머 찰칵!'}
                </button>
              </div>

              <div style="transform: scale(0.8); transform-origin: top center;">
                <div id="wizard-photocard-preview"></div>
              </div>
            </div>
          </div>
        `;
      }
    }

    window.wizardNextStep = () => {
      if (wizardCurrentStep < wizardTotalSteps) {
        wizardCurrentStep++;
        renderWizardApp();
        if (wizardCurrentStep === 5) {
          setTimeout(() => {
            const slot = document.getElementById('wizard-photocard-preview');
            const mainSlot = document.getElementById('photocard-preview-slot');
            if (slot && mainSlot) slot.innerHTML = mainSlot.innerHTML;
          }, 50);
        }
      }
    };

    window.wizardPrevStep = () => {
      if (wizardCurrentStep > 1) {
        wizardCurrentStep--;
        renderWizardApp();
      }
    };

    window.wizardSelectCategory = (catId) => {
      store.setCategory(catId);
      setTimeout(() => {
        window.wizardNextStep();
      }, 180);
    };

    window.wizardToggleSubject = (group, name) => {
      store.toggleSubject(group, name);
      renderWizardApp();
    };

    window.handleWizardCareerChange = (val) => {
      store.updateProfile({ targetCareer: val.trim() });
      store.matchTextbook(store.state.profile.careerCategory, val.trim());
      store.updateAdvice(store.state.profile.careerCategoryId, val.trim());
      store.notify();
    };

    // [9] App Bootstrapper
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
      renderWizardApp();
      store.subscribe(() => {
        renderApp();
        renderWizardApp();
      });

      document.getElementById('input-student-name').addEventListener('input', (e) => {
        store.updateProfile({ name: e.target.value });
      });

      document.getElementById('input-target-career').addEventListener('change', (e) => {
        const val = e.target.value.trim();
        store.updateProfile({ targetCareer: val });
        store.matchTextbook(store.state.profile.careerCategory, val);
        store.updateAdvice(store.state.profile.careerCategoryId, val);
        store.notify();
      });

      const openBoothBtn = document.getElementById('btn-open-booth');
      if (openBoothBtn) {
        openBoothBtn.addEventListener('click', () => window.openWebcamBooth());
      }

      document.getElementById('btn-manual-reset').addEventListener('click', () => {
        if (confirm('새 학생을 위해 세션을 초기화하시겠습니까?')) {
          store.reset();
          wizardCurrentStep = 1;
          document.getElementById('input-student-name').value = '';
          document.getElementById('input-target-career').value = '';
          renderWizardApp();
        }
      });

      document.getElementById('btn-print-card').addEventListener('click', () => window.print());
      document.getElementById('btn-save-telemetry').addEventListener('click', () => alert('학생 선택 데이터가 익명으로 무음 로깅되었습니다.'));

      // 3분 키오스크 타이머
      let remaining = 180;
      const timerDisplay = document.getElementById('kiosk-timer-display');
      setInterval(() => {
        remaining -= 1;
        if (remaining <= 0) {
          store.reset();
          wizardCurrentStep = 1;
          remaining = 180;
          renderWizardApp();
        }
        const m = Math.floor(remaining / 60);
        const s = remaining % 60;
        timerDisplay.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
      }, 1000);

      ['mousedown', 'keypress', 'touchstart'].forEach(evt => {
        window.addEventListener(evt, () => { remaining = 180; }, { passive: true });
      });
    });
  </script>
</body>
</html>
