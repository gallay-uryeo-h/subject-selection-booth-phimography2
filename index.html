<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 영어과목 3개년 로드맵 빌더 | 의령여자고등학교 선택과목 박람회</title>
  
  <!-- Academic Fonts (Pretendard & Cormorant Garamond) -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,700;1,600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- Core Design Tokens & Component Styles -->
  <link rel="stylesheet" href="./modules/m01-design/tokens.css">
  <link rel="stylesheet" href="./modules/m01-design/components.css">

  <style>
    /* 박람회 태블릿 및 데스크톱 최적화 레이아웃 */
    .app-container {
      max-width: 1380px;
      margin: 0 auto;
      padding: 1.5rem;
    }
    .grid-layout {
      display: grid;
      grid-template-columns: 1.15fr 0.85fr;
      gap: 1.5rem;
      align-items: start;
    }
    @media (max-width: 1024px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }
    .step-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .step-number {
      font-family: var(--font-serif);
      font-weight: 700;
      color: var(--color-oxford-navy);
      font-size: 1.1rem;
    }
    .career-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.65rem;
    }
    @media (max-width: 640px) {
      .career-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
    .career-chip {
      padding: 0.75rem;
      border: 1px solid var(--color-border-subtle);
      border-radius: var(--radius-md);
      background: var(--color-bg-base);
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all var(--transition-fast);
    }
    .career-chip:hover {
      border-color: var(--color-oxford-navy);
      background: var(--color-oxford-navy-subtle);
    }
    .career-chip.selected {
      background: var(--color-oxford-navy);
      color: #FFFFFF;
      border-color: var(--color-oxford-navy);
      box-shadow: var(--shadow-md);
    }
    .subject-pill {
      display: inline-flex;
      align-items: center;
      padding: 0.45rem 0.75rem;
      border-radius: var(--radius-sm);
      font-size: 0.825rem;
      font-weight: 600;
      border: 1px solid var(--color-border-subtle);
      cursor: pointer;
      background: var(--color-bg-base);
      transition: all var(--transition-fast);
      user-select: none;
    }
    .subject-pill.selected {
      background: var(--color-oxford-navy);
      color: #FFFFFF;
      border-color: var(--color-oxford-navy);
    }
  </style>
</head>
<body>

  <!-- Top Academic Navigation Bar -->
  <header class="academic-header">
    <div style="display: flex; align-items: center; gap: 1rem;">
      <div style="width: 38px; height: 38px; border-radius: 50%; background: var(--color-oxford-navy); color: #FFF; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-size: 1.2rem; font-weight: 700;">
        U
      </div>
      <div>
        <h1 class="academic-title">의령여자고등학교 선택과목 박람회</h1>
        <div class="academic-subtitle">영어과 부스 • 나의 영어과목 3개년 로드맵 빌더</div>
      </div>
    </div>

    <!-- Kiosk Session & Reset -->
    <div class="session-bar">
      <span>부스 세션 자동 초기화:</span>
      <div class="timer-indicator">
        <span>⏱️</span>
        <strong id="kiosk-timer-display">03:00</strong>
      </div>
      <button id="btn-manual-reset" class="academic-btn btn-outline" style="font-size: 0.75rem; padding: 0.35rem 0.65rem;">
        새로 시작
      </button>
    </div>
  </header>

  <!-- Main App Shell -->
  <main class="app-container">
    <div class="grid-layout">
      
      <!-- Left Column: Input, Career Selection & Roadmap Builder -->
      <section style="display: flex; flex-direction: column; gap: 1.25rem;">
        
        <!-- Step 1: Student Profile & Career Category (M01 & M02) -->
        <div class="academic-card">
          <div class="step-header">
            <span class="step-number">01.</span>
            <h3 style="font-size: 1rem; font-weight: 700; color: var(--color-oxford-navy);">진로 희망 계열 선택</h3>
          </div>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1rem;">
            <div>
              <label style="font-size: 0.75rem; color: var(--color-text-muted); display: block; margin-bottom: 0.25rem;">학생 이름</label>
              <input type="text" id="input-student-name" placeholder="예: 김의령" style="width: 100%; padding: 0.5rem; border: 1px solid var(--color-border-subtle); border-radius: 4px; font-size: 0.875rem;">
            </div>
            <div>
              <label style="font-size: 0.75rem; color: var(--color-text-muted); display: block; margin-bottom: 0.25rem;">희망 직업 / 목표 세부진로</label>
              <input type="text" id="input-target-career" placeholder="예: 글로벌 AI 윤리 전문가" style="width: 100%; padding: 0.5rem; border: 1px solid var(--color-border-subtle); border-radius: 4px; font-size: 0.875rem;">
            </div>
          </div>

          <label style="font-size: 0.75rem; color: var(--color-text-muted); display: block; margin-bottom: 0.5rem;">6대 핵심 진로 계열</label>
          <div class="career-grid" id="career-category-container">
            <!-- Dynamic Category Chips -->
          </div>
        </div>

        <!-- Step 2: 3-Year English Curriculum Roadmap (M02) -->
        <div id="curriculum-roadmap-slot">
          <!-- Rendered by CurriculumView component -->
        </div>

        <!-- Step 3: Textbook Evidence & PDF Viewer Slot (M03 & M04) -->
        <div id="module-textbook-preview-slot">
          <!-- Rendered by pdfViewerModule -->
        </div>

        <!-- Step 4: Academic Advisor 3-Step Guide (M05) -->
        <div class="academic-card" style="border-left: 4px solid var(--color-oxford-navy);">
          <div class="step-header">
            <span class="step-number">03.</span>
            <h3 style="font-size: 1rem; font-weight: 700; color: var(--color-oxford-navy);">아카데믹 어드바이저 세특 가이드</h3>
          </div>
          <div id="academic-advice-container" style="display: flex; flex-direction: column; gap: 0.65rem; font-size: 0.875rem;">
            <!-- Dynamic Advice Content -->
          </div>
        </div>

      </section>

      <!-- Right Column: Academic 4-Cut Card Realtime Preview (M06) -->
      <aside style="position: sticky; top: 5rem;">
        <div class="academic-card" style="box-shadow: var(--shadow-academic);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3 style="font-family: var(--font-serif); font-size: 1.15rem; color: var(--color-oxford-navy); font-weight: 700;">
              아카데믹 네컷 로드맵 카드
            </h3>
            <span class="academic-badge badge-suneung">4x6 인치 즉석 인쇄용</span>
          </div>

          <!-- Card Mount Slot -->
          <div id="photocard-preview-slot" style="display: flex; justify-content: center; margin-bottom: 1.25rem;">
            <!-- Rendered by photocardBuilder -->
          </div>

          <!-- Actions -->
          <div style="display: flex; gap: 0.5rem;">
            <button id="btn-print-card" class="academic-btn btn-primary" style="flex: 1;">
              🖨️ 네컷 카드 즉석 출력 (PNG)
            </button>
            <button id="btn-save-telemetry" class="academic-btn btn-outline">
              💾 완료 로깅
            </button>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <!-- Main ES Module Bootstrapper -->
  <script type="module" src="./main.js"></script>
</body>
</html>
